schema: nib.resource.v1
kind: diagnostics
container:
  image: nib-diagnostics:automatic-flow-basemap-v1
  build:
    context: "."
    dockerfile: diagnostics/Dockerfile
  command: ["--config", "{{request}}"]
  mounts:
    - name: run
      target: /run
      write: true
    - name: inputs
      target: /run/inputs
    - name: forecasts
      target: /run/forecasts
