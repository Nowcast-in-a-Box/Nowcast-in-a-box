[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nib-verify"
version = "0.1.0"
description = "NiB verification module (D1): metrics from stored arrays"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary until the project declares one" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# PyYAML is in both: the config loader and the catalog both read YAML, and a
# database without a catalogue is of little use.
dev = ["pytest>=7.4", "PyYAML>=6.0", "httpx>=0.27", "fastapi>=0.110"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "PyYAML>=6.0"]

[project.scripts]
nib-verify = "nib_verify.cli:main"

[tool.setuptools.packages.find]
include = ["nib_verify*"]

# The store's DDL and the review page are data, not modules. Without this a wheel
# would install a package that cannot open a database or serve a page.
[tool.setuptools.package-data]
nib_verify = ["store/*.sql", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["../../tests/verification"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]
