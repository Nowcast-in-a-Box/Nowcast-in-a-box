<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiB verification</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAm0lEQVR42mNkwAK0cr/8Z6ABuDaZhxFdjJEeFuNzCBO9LUe3i4nelqM7golhgAHjQPgeGQx4CAy4A1go0Xx1EjecrZ33lb4hgGw5Nv5oGhh1wPDKhtTIbmSHALWy2/AsCakRZUy0tJyYKBvNhqMOIOgA9FQM45MqPtomxOkAbN0leoFrk3kYB0ciHIhQgNnJhK/nSo/OKeNAd88Bl8o/Qv8ybkgAAAAASUVORK5CYII=">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>



<main>
<!-- ==================================================== results -->
<section id="tab-results">
  <div class="split">

    <!-- left: what to ask -->
    <div class="ask">
      <div class="card">
        <h2>Query</h2>

        <div class="row" style="gap:10px; margin-bottom:10px">
          <div class="field" style="flex:1 1 0; min-width:0">
            <label for="q-config">Config</label>
            <select id="q-config"></select>
          </div>
          <div class="field" style="flex:1 1 0; min-width:0">
            <label for="q-method">Metric</label>
            <select id="q-method"></select>
          </div>
        </div>

        <label class="tiny muted">Parameters</label>
        <div id="q-params"></div>

        <label class="tiny muted" style="display:block; margin-top:12px">Init time</label>
        <div class="chips" id="q-init-quick"></div>
        <!-- The browser's own date picker cannot be changed: it draws its own
             footer, with Today and Clear on it and no way to say done. So the
             value lives in hidden fields and the panel is ours, with the one
             button it was missing on it. -->
        <input type="hidden" id="q-init-from">
        <input type="hidden" id="q-init-to">
        <button type="button" id="btn-init-range" class="range-button"
                title="Choose the init time range"></button>
        <div id="init-panel" class="popup" hidden>
          <div class="popup-row"><span class="tiny muted">from</span>
            <span class="seg" id="init-from-fields"></span></div>
          <div class="popup-row"><span class="tiny muted">to</span>
            <span class="seg" id="init-to-fields"></span></div>
          <div class="popup-foot">
            <button class="chip primary" type="button" id="btn-init-ok">OK</button>
          </div>
        </div>

        <div class="row" style="gap:10px; margin-top:10px; align-items:flex-end">
          <div class="field" style="flex:1 1 0; min-width:0">
            <label class="tiny" for="q-lead-from">Lead from (min)</label>
            <input type="number" id="q-lead-from" min="0" step="1" placeholder="all">
          </div>
          <div class="field" style="flex:1 1 0; min-width:0">
            <label class="tiny" for="q-lead-to">to (min)</label>
            <input type="number" id="q-lead-to" min="0" step="1" placeholder="all">
          </div>
        </div>

        <div class="row" style="gap:10px; margin-top:12px; align-items:flex-end">
          <div class="field" style="flex:1 1 0; min-width:0">
            <label for="q-axis">Along</label>
            <select id="q-axis">
              <option value="lead_minutes">lead minutes</option>
              <option value="init_time">init time</option>
              <option value="hour">hour of init</option>
              <option value="init_time+lead_minutes">init &times; lead</option>
            </select>
          </div>
          <button class="act" id="btn-query" style="flex:0 0 auto">Run query</button>
        </div>
        <span class="muted tiny" id="query-hint"></span>
      </div>
    </div>

    <!-- right: the answer -->
    <div class="answer">
      <div class="card">
        <h2 style="margin:0 0 6px">Chart</h2>
        <div id="chart-card" hidden>
          <div class="row" style="margin:8px 0 10px; justify-content:space-between">
            <!-- The key on the left and the form hard right: the key is what the
                 eye goes to, and the two buttons are what the hand does. -->
            <div class="chips" id="chart-legend"></div>
            <div class="row" style="gap:8px">
              <span class="muted tiny" id="q-kind-note"></span>
              <div class="chips" id="q-kind"></div>
            </div>
          </div>
          <img id="chart" alt="chart of the current query" style="width:100%; height:auto; display:block">
        </div>
        <div id="chart-empty" class="empty">Pick a config and run a query.</div>
        <!-- What the picture is of, and the numbers behind it, below the picture
             and not inside it: the canvas is meant to be worth saving on its
             own, and a line of small grey text across the plot is not part of
             the chart. -->
        <p class="tiny muted" id="chart-note" style="margin:8px 0 0"></p>
      </div>

      <div id="query-result"></div>

  </div>
</section>

</main>

<script src="/static/app.js"></script>
</body>
</html>
