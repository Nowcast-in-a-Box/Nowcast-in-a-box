schema: nib.resource.v1
kind: model
id: nowcastnet
product_ids: [nowcastnet-sevir]
name: NowcastNet
weights:
  file: NowcastNet.onnx
  sha256: "773b6cbe0b1e0c8cea3b62932dc60b108b60885a54f7445a0074a48d4810b37d"
container:
  image: nib-nowcastnet:dev
  build:
    context: "."
    dockerfile: adapters/sevir/nowcastnet/Dockerfile
  command: ["--run", "/run", "--weights", "/weights/model.onnx"]
  mounts:
    - name: run
      target: /run
      write: true
    - name: inputs
      target: /run/inputs
    - name: weights
      target: /weights/model.onnx
