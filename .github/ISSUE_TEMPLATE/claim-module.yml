name: Claim work
description: Take a piece of work before writing code. The issue number becomes the id in branches, commits, and PRs.
title: "claim: "
labels:
  - claim
body:
  - type: markdown
    attributes:
      value: |
        GitHub will give this issue a number. Use that number in your commits (`feat: … (#12)`), and
        the PR (`Closes #12`). See [CONTRIBUTING.md](https://github.com/Nowcast-in-a-Box/Nowcast-in-a-box/blob/main/CONTRIBUTING.md).
  - type: dropdown
    id: part
    attributes:
      label: Part
      description: "Which part of the project is this work related to?"
      options:
        - Handler
        - Visualization
        - Evaluation
        - Docker
        - Framework
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: What will be done, and how. Briefly describe the plan for the work.
    validations:
      required: true
