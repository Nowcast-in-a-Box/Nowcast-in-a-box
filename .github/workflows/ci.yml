name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Parked until handler tests are ready to gate merges.
  # Re-enable: delete `if: false` and add `test` back to the `ci` job's needs.
  test:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: handler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Build native
        run: go build -o "nib-handler$(go env GOEXE)" .

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile
        run: scripts/cross-build.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nib-handler
          path: handler/dist/nib-handler-*
          if-no-files-found: error

  ci:
    needs: [cross-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require cross-build
        run: |
          set -euo pipefail
          test "${{ needs.cross-build.result }}" = success
