name: ci

# Every pull request and every push to main runs the full test matrix.
# Python jobs install pinned lock files only; Python 3.12, Go 1.22.
# Local precheck: scripts/run-tests.sh. GitHub checks are the gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handler:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build native
        run: go build -o "nib-handler$(go env GOEXE)" ./handler/cmd/nib-handler

  adapters-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.lock.txt

      - name: Install pinned dependencies
        run: pip install -r tests/requirements-dev.lock.txt

      - name: Test
        run: PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/diagnostics/verification:$GITHUB_WORKSPACE/diagnostics/visualization:$GITHUB_WORKSPACE/diagnostics/visualization/src" pytest tests/adapters tests/runtime

  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: diagnostics/verification
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diagnostics/verification/requirements-dev.lock.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.lock.txt

      # Runs from diagnostics/verification so its pyproject applies:
      # testpaths -> ../../tests/verification, filterwarnings = error::RuntimeWarning.
      - name: Test
        run: PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/diagnostics/verification:$GITHUB_WORKSPACE/diagnostics/visualization:$GITHUB_WORKSPACE/diagnostics/visualization/src" pytest

  visualization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: diagnostics/visualization
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diagnostics/visualization/requirements-viewer.lock.txt

      # viewer lock includes the dev lock plus the rasterio closure; the suite
      # imports rasterio at module level in several test files.
      - name: Install pinned dependencies
        run: pip install -r requirements-viewer.lock.txt

      # Runs from diagnostics/visualization so its pyproject applies:
      # testpaths -> ../../tests/visualization.
      - name: Test
        run: PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/diagnostics/verification:$GITHUB_WORKSPACE/diagnostics/visualization:$GITHUB_WORKSPACE/diagnostics/visualization/src" pytest

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile
        run: scripts/cross-build.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nib-handler
          path: |
            bin/linux/nib-handler-*
            bin/macos/nib-handler-*
            bin/windows/nib-handler-*
          if-no-files-found: error
