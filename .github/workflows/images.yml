name: publish images

# Manual bootstrap for the GHCR images used by the Handler. The first Handler
# startup pulls the diagnostics image; Validate pulls the selected data/model
# image when the local tag is absent.
#
# The CMA data reader and its NowcastNet model are published as multi-arch
# manifest lists: each platform builds on its own native runner, then a merge
# job writes the short tag that the runtime manifests reference. `docker pull`
# therefore returns the host architecture, so an Apple Silicon Mac stops
# emulating linux/amd64 for the CMA demo. The diagnostics image is still
# amd64-only.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish the diagnostics image
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          docker build -f diagnostics/Dockerfile -t "ghcr.io/$owner/nib-diagnostics:automatic-flow" .
          docker push "ghcr.io/$owner/nib-diagnostics:automatic-flow"

  cma:
    name: ${{ matrix.image.name }} (${{ matrix.platform.platform }})
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nib-ingestion
            dockerfile: adapters/cma_radar/Dockerfile
            tag: cma-demo
          - name: nib-nowcastnet
            dockerfile: adapters/cma_radar/nowcastnet/Dockerfile
            tag: cma-demo-embedded
        platform:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare pinned embedded NowcastNet weight
        if: matrix.image.name == 'nib-nowcastnet'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REVISION: ${{ vars.NIB_NOWCASTNET_HF_REVISION }}
        run: |
          set -euo pipefail
          if [[ ! "$HF_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Set NIB_NOWCASTNET_HF_REVISION to the immutable Hugging Face commit containing the pinned ONNX file." >&2
            exit 1
          fi
          if [[ -z "$HF_TOKEN" ]]; then
            echo "Set the HF_TOKEN repository secret with read access to sonderlau/nib-nowcastnet." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/nowcastnet-weights"
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/sonderlau/nib-nowcastnet/resolve/$HF_REVISION/NowcastNet.onnx" \
            --output "$RUNNER_TEMP/nowcastnet-weights/NowcastNet.onnx"
          echo "773b6cbe0b1e0c8cea3b62932dc60b108b60885a54f7445a0074a48d4810b37d  $RUNNER_TEMP/nowcastnet-weights/NowcastNet.onnx" | sha256sum -c -

      - name: Build and publish ${{ matrix.platform.platform }}
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          contexts=()
          if [[ "${{ matrix.image.name }}" == "nib-nowcastnet" ]]; then
            contexts+=(--build-context "weights=$RUNNER_TEMP/nowcastnet-weights")
          fi
          docker buildx build \
            --platform "${{ matrix.platform.platform }}" \
            "${contexts[@]}" \
            -f "${{ matrix.image.dockerfile }}" \
            -t "ghcr.io/$owner/${{ matrix.image.name }}:${{ matrix.image.tag }}-${{ matrix.platform.suffix }}" \
            --push .

  cma-merge:
    needs: cma
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nib-ingestion
            tag: cma-demo
          - name: nib-nowcastnet
            tag: cma-demo-embedded
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Write the multi-arch runtime tag
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create \
            -t "ghcr.io/$owner/${{ matrix.image.name }}:${{ matrix.image.tag }}" \
            "ghcr.io/$owner/${{ matrix.image.name }}:${{ matrix.image.tag }}-amd64" \
            "ghcr.io/$owner/${{ matrix.image.name }}:${{ matrix.image.tag }}-arm64"
          docker buildx imagetools inspect "ghcr.io/$owner/${{ matrix.image.name }}:${{ matrix.image.tag }}"
