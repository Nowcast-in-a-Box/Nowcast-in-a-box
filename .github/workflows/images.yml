name: publish images

# Model inference is manual and private. No PR trigger or model matrix.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Image to release (one target only)
        type: choice
        options: [model, diagnostics]
        required: true
      model:
        description: Model pair, used only for target=model
        type: choice
        options: [cma_radar/nowcastnet, sevir/nowcastnet, sevir/exprecast, sevir/wadepre]
        required: true
      platform:
        description: One platform; model runner must support it
        type: choice
        options: [linux/amd64, linux/arm64]
        required: true
      tag:
        description: Explicit candidate tag (include architecture; no manifest merge)
        type: string
        required: true
      prepared_run:
        description: Absolute private path on self-hosted runner to a fresh adapter-prepared run
        type: string
      weights:
        description: Absolute private path on self-hosted runner to verified weights
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: manual-image-release
  cancel-in-progress: false

jobs:
  model:
    if: inputs.target == 'model'
    # Provision this trusted runner separately; never put CMA samples on GitHub.
    runs-on: [self-hosted, linux, nib-model-release]
    timeout-minutes: 60
    env:
      MODEL: ${{ inputs.model }}
      PLATFORM: ${{ inputs.platform }}
      TAG: ${{ inputs.tag }}
      PREPARED_RUN: ${{ inputs.prepared_run }}
      WEIGHTS: ${{ inputs.weights }}
      OWNER: ${{ github.repository_owner }}
      RELEASE_PYTHON: ${{ vars.NIB_RELEASE_PYTHON || 'python3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Require private release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREPARED_RUN" = /* && -f "$PREPARED_RUN/manifest.json" ]]
          [[ "$WEIGHTS" = /* && -f "$WEIGHTS" ]]
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$MODEL" =~ ^[a-z0-9_-]+/[a-z0-9_-]+$ ]]

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build locally, infer offline, validate readers, then push
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/diagnostics/verification"
          image="ghcr.io/${OWNER,,}/nib-${MODEL##*/}:$TAG"
          # Keep model output and any data-bearing exceptions on the private runner.
          # StoredFields is mandatory for every pair; CMA also checks RunSource.
          # Unsupported diagnostic handoffs are reported in the private release.log.
          if ! "$RELEASE_PYTHON" scripts/validate-model-release.py \
            --model "$MODEL" --platform "$PLATFORM" --image "$image" \
            --run "$PREPARED_RUN" --weights "$WEIGHTS" --push \
            > "$PREPARED_RUN/release.log" 2>&1; then
            echo 'Release failed. Inspect release.log in the prepared run on the private runner.' >&2
            exit 1
          fi
          echo 'Selected model/platform passed validation and was pushed.'

  diagnostics:
    if: inputs.target == 'diagnostics'
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      PLATFORM: ${{ inputs.platform }}
      TAG: ${{ inputs.tag }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish diagnostics for selected platform
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          docker buildx build --platform "$PLATFORM" -f diagnostics/Dockerfile \
            -t "ghcr.io/${OWNER,,}/nib-diagnostics:$TAG" --push .
